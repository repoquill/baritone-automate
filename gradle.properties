# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# https://fabricmc.net/develop — Minecraft 26.3 is unobfuscated: Loom plugin net.fabricmc.fabric-loom, no Yarn, no remap.
minecraft_version=26.3
# Locked to Baritone's fabric.mod.json (>=0.19.5) and the Fabric 26.3 example.
# Loader 0.20+ is acceptable when it still supports 26.3; see README.
loader_version=0.19.5
# 1.18.4 is built for Gradle plugin API 9.7.0. 9.6.1 cannot resolve it.
# No published Loom declares plugin API 9.6.1. See README.
loom_version=1.18.4

# Mod Properties
version=0.1.3
group=dev.baritoneautomate

# Dependencies
fabric_api_version=0.163.0+26.3
